## Perfil de desenvolvimento local.
##
##   mvn spring-boot:run -Dspring-boot.run.profiles=local
##
## Este arquivo sobrescreve o application.properties quando o perfil "local"
## esta ativo. Ele existe para deixar o desenvolvimento mais confortavel
## (mostrar o SQL no console) sem atrapalhar a producao.

## Mostra o SQL executado no console - ajuda a entender o que a aplicacao
## esta fazendo por tras. NUNCA habilite isso em producao: alem de
## poluir o log, expor as queries ajuda quem tenta explorar o sistema.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

## Log detalhado da aplicacao.
logging.level.br.com.selecao.locadora=DEBUG
logging.level.org.hibernate.SQL=DEBUG

## Frontend Vue rodando na porta padrao do Vue CLI.
app.cors.origins=http://localhost:8080,http://127.0.0.1:8080
