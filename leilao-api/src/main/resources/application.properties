## =============================================================================
##  APPLICATION.PROPERTIES  |  Configuracao principal da aplicacao
## =============================================================================
##
##  COMO LER ESTE ARQUIVO
##  Cada linha e uma "chave = valor". O Spring Boot le na inicializacao e
##  aplica a configuracao. Linhas comecadas com # sao comentarios.
##
##  REGRA DE OURO QUE USEI AQUI:
##  NENHUMA SENHA DE VERDADE ESTA ESCRITA NESTE ARQUIVO.
##  Todas as credenciais do banco chegam por VARIAVEL DE AMBIENTO, com um
##  valor padrao apenas para desenvolvimento. O padrao e sobrescrito
##  com:
##      set DATABASE_PASSWORD=xxx   (Windows)
##      export DATABASE_PASSWORD=xxx (Linux/Mac)
##  Assim o arquivo versionado no Git nunca vaza segredo - e o mesmo
##  arquivo serve para todos os ambientes (dev, homologacao, producao).
## =============================================================================

## -----------------------------------------------------------------------------
## PORTA E ENCODING
## -----------------------------------------------------------------------------
## A API roda na porta 8081. O frontend Vue roda na 8080 (padrao do Vue CLI).
## Sao portas diferentes de proposito: e o que faz o CORS entrar em acao.
server.port=8081
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

## -----------------------------------------------------------------------------
## POSTGRES
## -----------------------------------------------------------------------------
## DATABASE_URL: a variavel de ambiente tem prioridade; o valor depois dos
## ":" e apenas o padrao de desenvolvimento local.
##
##  Local (Postgres instalado na maquina): jdbc:postgresql://localhost:5432/az
##  Docker (docker-database.yml):        jdbc:postgresql://database:5432/az
##    (nesse caso o host e "database", que e o nome do servico no compose)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/az}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

## -----------------------------------------------------------------------------
## JPA / HIBERNATE
## -----------------------------------------------------------------------------
## ddl-auto=none: o Hibernate NAO cria nem altera tabelas. Quem faz isso e o
## script 01_ddl.sql, que a gente versiona e controla. Deixar o Hibernate
## mexer no esquema em producao e uma das maiores fontes de acidente
## (ele pode alterar ou apagar coluna sem ninguem pedir).
spring.jpa.hibernate.ddl-auto=none

## show-sql=false: em desenvolvimento voce pode ativar com
##   --spring.jpa.show-sql=true
## ou usando o perfil "local" (application-local.properties).
## Deixar ligado em producao polui o log e deixa o sistema mais lento.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

## open-in-view=false: o padrao do Spring Boot e deixar a sessao do banco
## aberta durante toda a requisicao HTTP. Fechando explicitamente, cada
## camada busca o que precisa dentro da sua transacao - mais rapido e
## mais previsivel.
spring.jpa.open-in-view=false

## -----------------------------------------------------------------------------
## SEGURANCA
## -----------------------------------------------------------------------------
## Lista de origens (frontends) autorizadas a chamar esta API.
## Em producao, defina para o dominio real da aplicacao.
app.cors.origins=${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

## Liga/desliga a exigencia de autenticacao.
## false (padrao) = endpoints abertos, como o enunciado do teste pede.
## true            = exige usuario e senha (usado no perfil "prod").
app.security.enabled=${SECURITY_ENABLED:false}

## Usuario/senha da autenticacao HTTP Basic (usados so quando
## app.security.enabled=true). Em producao, NAO use este padrao:
## defina as variaveis de ambiente com credenciais fortes.
app.security.username=${SECURITY_USERNAME:admin}
app.security.password=${SECURITY_PASSWORD:troque-esta-senha}

## -----------------------------------------------------------------------------
## CONTROLE ANTI-FORCA-BRUTA
## -----------------------------------------------------------------------------
## O BCrypt e lento de proposito, mas "lento" nao e "impossivel": sem um
## limite de tentativas, um atacante pode disparar milhares de senhas por
## minuto. Estes parametros definem quando a conta (ou o IP) e bloqueada.
## Ver a classe LoginAttemptService.
##
## enabled: liga/desliga o controle (padrao: ligado).
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

## max-attempts: falhas do MESMO usuario (no mesmo IP) antes de bloquear
## a conta. Padrao: 5.
app.security.rate-limit.max-attempts=${RATE_LIMIT_MAX_ATTEMPTS:5}

## max-attempts-per-ip: falhas do MESMO IP (somando todos os usuarios)
## antes de bloquear o IP inteiro. Protege a aplicacao de ataques
## pulverizados (5 senhas para 1000 usuarios). Padrao: 20.
app.security.rate-limit.max-attempts-per-ip=${RATE_LIMIT_MAX_ATTEMPTS_PER_IP:20}

## window-minutes: duracao da janela de contagem, em minutos. Depois
## desse tempo sem nova falha, o contador zera. Padrao: 15.
app.security.rate-limit.window-minutes=${RATE_LIMIT_WINDOW_MINUTES:15}

## cleanup-interval-ms: intervalo da tarefa agendada que apaga da
## memoria os contadores ja vencidos. Padrao: 60000 (1 minuto).
app.security.rate-limit.cleanup-interval-ms=${RATE_LIMIT_CLEANUP_INTERVAL_MS:60000}

## -----------------------------------------------------------------------------
## CONFIANCA NO CABECALHO X-FORWARDED-FOR
## -----------------------------------------------------------------------------
## REGRA DE SEGURANCA IMPORTANTE:
## O cabecalho "X-Forwarded-For" pode ser enviado por QUALQUER cliente.
## Se confiassemos nele sem condicao, o atacante burlaria o bloqueio de
## forca bruta trocando o valor do cabecalho a cada tentativa.
##
## Portanto: deixe "false" (padrao) sempre que a aplicacao estiver
## rodando DIRETO, sem proxy na frente. Ligue ("true") apenas quando
## existir um proxy reverso CONFIAVEL (Nginx, balanceador da nuvem) e
## NINGUEM mais conseguir alcancar a aplicacao sem passar por ele.
## O perfil "prod" ja liga esta opcao.
app.security.trust-proxy=${TRUST_PROXY:false}

## -----------------------------------------------------------------------------
## TRATAMENTO DE ERROS (seguranca: nao vazar stack trace)
## -----------------------------------------------------------------------------
## include-stacktrace=never: em caso de erro, o cliente NAO recebe a pilha
## de execucao (que revelaria classes, caminhos de arquivo e SQL).
## include-message=never: a mensagem tecnica do framework tambem nao vaza.
## O que o cliente recebe e a resposta padronizada do GlobalExceptionHandler.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

## Quando a URL nao corresponde a nenhum endpoint, o Spring lanca a excecao
## NoHandlerFoundException em vez de tentar servir um arquivo estatico. Com
## isso o GlobalExceptionHandler devolve o nosso JSON de erro padronizado
## (HTTP 404) em vez da pagina de erro padrao do framework.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

## -----------------------------------------------------------------------------
## JSON
## -----------------------------------------------------------------------------
## non_null: campos nulos nao sao serializados. Deixa o JSON mais leve e
## evita que o frontend interprete "campo presente com null" como
## "campo obrigatorio vazio".
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

## -----------------------------------------------------------------------------
## ATUATOR (monitoramento)
## -----------------------------------------------------------------------------
## Expose apenas o necessario. O padrao do Spring Boot expoe varios
## endpoints (env, beans, configprops...) e alguns deles vazam informacao
## interna da aplicacao. Expor so "health" e "info" e a pratica segura.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

## -----------------------------------------------------------------------------
## LOG
## -----------------------------------------------------------------------------
logging.level.br.com.selecao.locadora=INFO
logging.level.org.hibernate.SQL=WARN
