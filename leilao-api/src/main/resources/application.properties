## Configuracao principal da aplicacao.
##
## Nenhuma senha de verdade fica escrita aqui: todas as credenciais do
## banco chegam por variavel de ambiente, com um valor padrao que serve so
## para desenvolvimento. Para trocar:
##   set DATABASE_PASSWORD=xxx     (Windows)
##   export DATABASE_PASSWORD=xxx   (Linux/Mac)
## Assim o arquivo versionado no Git nunca vaza segredo, e o mesmo arquivo
## serve para dev, homologacao e producao.


## Porta e encoding
## A API roda na porta 8081. O frontend Vue roda na 8080 (padrao do Vue CLI).
## Sao portas diferentes de proposito: e o que faz o CORS entrar em acao.
server.port=8081
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true


## Postgres
## DATABASE_URL: a variavel de ambiente tem prioridade; o valor depois dos
## ":" e apenas o padrao de desenvolvimento local.
##
##  Local (Postgres instalado na maquina): jdbc:postgresql://localhost:5432/az
##  Docker (docker-database.yml):        jdbc:postgresql://database:5432/az
##    (nesse caso o host e "database", que e o nome do servico no compose)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/az}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


## JPA / Hibernate
## ddl-auto=none: o Hibernate NAO cria nem altera tabelas. Quem faz isso e o
## script 01_ddl.sql, que a gente versiona e controla. Deixar o Hibernate
## mexer no esquema em producao e uma das maiores fontes de acidente
## (ele pode alterar ou apagar coluna sem ninguem pedir).
spring.jpa.hibernate.ddl-auto=none

## show-sql=false: em desenvolvimento voce pode ativar com
##   --spring.jpa.show-sql=true
## ou usando o perfil "local" (application-local.properties).
## Deixar ligado em producao polui o log e deixa o sistema mais lento.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

## open-in-view=false: o padrao do Spring Boot e deixar a sessao do banco
## aberta durante toda a requisicao HTTP. Fechando explicitamente, cada
## camada busca o que precisa dentro da sua transacao - mais rapido e
## mais previsivel.
spring.jpa.open-in-view=false


## Seguranca
## Lista de origens (frontends) autorizadas a chamar esta API.
## Em producao, defina para o dominio real da aplicacao.
app.cors.origins=${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

## Liga/desliga a exigencia de autenticacao.
## false (padrao) = endpoints abertos, como o enunciado do teste pede.
## true            = exige usuario e senha (usado no perfil "prod").
app.security.enabled=${SECURITY_ENABLED:false}

## Usuario/senha da autenticacao HTTP Basic (usados so quando
## app.security.enabled=true). Em producao, NAO use este padrao:
## defina as variaveis de ambiente com credenciais fortes.
app.security.username=${SECURITY_USERNAME:admin}
app.security.password=${SECURITY_PASSWORD:troque-esta-senha}


## Codificacao de senha (argon2id)
## A senha NUNCA e guardada em texto puro: guardamos apenas um HASH.
##
## Argon2id e o algoritmo recomendado pela OWASP no "Password Storage
## Cheat Sheet" de 2023, porque usa MEMORIA como recurso principal - o que
## trava o ataque paralelo em GPU (cada tentativa de ataque consome dezenas
## de megabytes).
##
## Os parametros abaixo sao os recomendados pela OWASP ("m=19MiB, t=2, p=1"
## ou mais). O padrao aqui e 64 MiB, acima do minimo recomendado.
##
## ATENCAO: com Argon2id, o controle anti-forca-bruta deixa de ser um extra
## e vira OBRIGATORIO. Sem ele, cada tentativa de login seria uma alocacao
## de 64 MiB - e o proprio login viraria um vetor de esgotamento de memoria.
app.security.password.argon2.memory=${ARGON2_MEMORY:65536}
app.security.password.argon2.iterations=${ARGON2_ITERATIONS:2}
app.security.password.argon2.parallelism=${ARGON2_PARALLELISM:1}
app.security.password.argon2.hash-length=${ARGON2_HASH_LENGTH:32}
app.security.password.argon2.salt-length=${ARGON2_SALT_LENGTH:16}


## Modo de autenticacao
## "basic" (padrao): HTTP Basic - o cliente envia o cabecalho
##                  "Authorization: Basic <base64>".
## "jwt":            o cliente faz POST /auth/login, recebe um par de tokens
##                   e envia o token de acesso no cabecalho
##                   "Authorization: Bearer <token>".
##
## Os dois modos produzem o MESMO objeto de autenticacao no contexto de
## seguranca, entao as regras de acesso sao identicas nos dois casos.
app.security.mode=${SECURITY_MODE:basic}


## Token jwt (assimetrico, rs256)
## A assinatura e asimétrica de proposito: a chave PRIVADA fica apenas na
## aplicacao (que assina), e a chave PUBLICA pode ser distribuida
## livremente (que verifica). Com uma chave simetrica, quem consegue
## verificar um token consegue tambem forjar um - e o "segredo" acabaria
## exposto em todo servico que valida o token.
##
## O cabecalho "kid" do token guarda o identificador da chave. E isso que
## permite ROTACIONAR CHAVES sem derrubar ninguem: a aplicacao carrega a
## chave antiga (ainda valida) E a nova (ja assina), e cada token continua
## sendo conferido com a chave correta.
##
## Para rotacionar: gere um novo par, coloque os arquivos .pem na pasta
## de chaves, mude o "active-key-id" e reinicie.
app.security.jwt.issuer=${JWT_ISSUER:az-leilao-api}
app.security.jwt.keys-dir=${JWT_KEYS_DIR:}
app.security.jwt.active-key-id=${JWT_ACTIVE_KEY_ID:az-leilao-dev-01}

## Validade do token de ACESSO. Curto de proposito: o token de acesso
## viaja em TODA requisicao, entao quanto menor a janela de exposição,
## menor o dano de um token vazado.
app.security.jwt.access-token-ttl=${JWT_ACCESS_TTL:PT15M}

## Validade do token de RENOVACAO. Longo de proposito: e ele que evita
## que o usuario precise digitar a senha a cada 15 minutos. Mas como ele
## e de uso unico (com deteccao de reuso), o risco e baixo.
app.security.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:P7D}


## Trilha de auditoria a prova de adulteracao
## Chave do HMAC-SHA256 usada para selar cada registro da trilha.
##
## IMPORTANTE: em producao, defina esta variavel de ambiente com um valor
## ALEATORIO de pelo menos 32 bytes. Sem a chave, a aplicacao gera uma
## efemera - o que funciona para desenvolvimento, mas reinicia a API e
## invalida a verificacao da trilha anterior.
app.security.audit.hmac-key=${AUDIT_HMAC_KEY:}


## Controle anti-forca-bruta
## O Argon2id e lento de proposito, mas "lento" nao e "impossivel": sem um
## limite de tentativas, um atacante pode disparar milhares de senhas por
## minuto. Estes parametros definem quando a conta (ou o IP) e bloqueada.
## Ver a classe LoginAttemptService.
##
## enabled: liga/desliga o controle (padrao: ligado).
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

## max-attempts: falhas do MESMO usuario (no mesmo IP) antes de bloquear
## a conta. Padrao: 5.
app.security.rate-limit.max-attempts=${RATE_LIMIT_MAX_ATTEMPTS:5}

## max-attempts-per-ip: falhas do MESMO IP (somando todos os usuarios)
## antes de bloquear o IP inteiro. Protege a aplicacao de ataques
## pulverizados (5 senhas para 1000 usuarios). Padrao: 20.
app.security.rate-limit.max-attempts-per-ip=${RATE_LIMIT_MAX_ATTEMPTS_PER_IP:20}

## window-minutes: duracao da janela de contagem, em minutos. Depois
## desse tempo sem nova falha, o contador zera. Padrao: 15.
app.security.rate-limit.window-minutes=${RATE_LIMIT_WINDOW_MINUTES:15}

## cleanup-interval-ms: intervalo da tarefa agendada que apaga da
## memoria os contadores ja vencidos. Padrao: 60000 (1 minuto).
app.security.rate-limit.cleanup-interval-ms=${RATE_LIMIT_CLEANUP_INTERVAL_MS:60000}


## Limitador de requisicoes por IP (protecao do recurso)
## O controle anti-forca-bruta protege a CONTA do usuario. Este protege o
## RECURSO: a API inteira.
##
## Um atacante que nao quer nem tentar logar ainda consegue derrubar o
## sistema disparando requisicoes (negacao de servico) ou gastando CPU
## com consultas pesadas.
##
## O algoritmo e' de JANELA DESLIZANTE: conta as requisicoes dos ultimos
## N segundos, e nao dentro de um bloco fixo. Com bloco fixo, um atacante
## dispararia o dobro do limite na virada do minuto.
app.security.rate-limit.api.enabled=${API_RATE_LIMIT_ENABLED:true}
app.security.rate-limit.api.max-requests=${API_RATE_LIMIT_MAX_REQUESTS:120}
app.security.rate-limit.api.window-seconds=${API_RATE_LIMIT_WINDOW_SECONDS:60}


## Confianca no cabecalho X-Forwarded-For
## REGRA DE SEGURANCA IMPORTANTE:
## O cabecalho "X-Forwarded-For" pode ser enviado por QUALQUER cliente.
## Se confiassemos nele sem condicao, o atacante burlaria o bloqueio de
## forca bruta trocando o valor do cabecalho a cada tentativa.
##
## Portanto: deixe "false" (padrao) sempre que a aplicacao estiver
## rodando DIRETO, sem proxy na frente. Ligue ("true") apenas quando
## existir um proxy reverso CONFIAVEL (Nginx, balanceador da nuvem) e
## NINGUEM mais conseguir alcancar a aplicacao sem passar por ele.
## O perfil "prod" ja liga esta opcao.
app.security.trust-proxy=${TRUST_PROXY:false}


## Tratamento de erros (seguranca: nao vazar stack trace)
## include-stacktrace=never: em caso de erro, o cliente NAO recebe a pilha
## de execucao (que revelaria classes, caminhos de arquivo e SQL).
## include-message=never: a mensagem tecnica do framework tambem nao vaza.
## O que o cliente recebe e a resposta padronizada do GlobalExceptionHandler.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

## Quando a URL nao corresponde a nenhum endpoint, o Spring lanca a excecao
## NoHandlerFoundException em vez de tentar servir um arquivo estatico. Com
## isso o GlobalExceptionHandler devolve o nosso JSON de erro padronizado
## (HTTP 404) em vez da pagina de erro padrao do framework.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false


## JSON
## non_null: campos nulos nao sao serializados. Deixa o JSON mais leve e
## evita que o frontend interprete "campo presente com null" como
## "campo obrigatorio vazio".
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss


## Atuator (monitoramento)
## Expose apenas o necessario. O padrao do Spring Boot expoe varios
## endpoints (env, beans, configprops...) e alguns deles vazam informacao
## interna da aplicacao. Expor so "health" e "info" e a pratica segura.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never


## Log
logging.level.br.com.selecao.locadora=INFO
logging.level.org.hibernate.SQL=WARN
