## =============================================================================
##  APPLICATION-PROD.PROPERTIES  |  Perfil de PRODUCAO
## =============================================================================
##
##  COMO USAR:
##      mvn spring-boot:run -Dspring-boot.run.profiles=prod
##  ou empacotando e executando o jar:
##      java -jar target/leilao-api-1.0.0-SNAPSHOT.jar --spring.profiles.active=prod
##
##  QUANDO ESTE PERFIL ESTA ATIVO:
##  - TODA rota da API exige autenticacao (HTTP Basic);
##  - as credenciais do banco e da API vem OBRIGATORIAMENTE de variaveis
##    de ambiente - se faltarem, a aplicacao NAO SOBE (falha na hora de
##    iniciar, e nao no meio do expediente com a API no ar e sem credencial).
##
##  COMO DEFINIR AS VARIAVEIS (Windows PowerShell):
##      $env:DATABASE_URL="jdbc:postgresql://localhost:5432/az"
##      $env:DATABASE_USER="leilao_app"
##      $env:DATABASE_PASSWORD="uma-senha-forte-aqui"
##      $env:SECURITY_ENABLED="true"
##      $env:SECURITY_USERNAME="admin"
##      $env:SECURITY_PASSWORD="outra-senha-forte-aqui"
##      $env:CORS_ORIGINS="https://leilao.minhaempresa.com.br"
## =============================================================================

## Ativa a exigencia de autenticacao.
app.security.enabled=true

## As credenciais DO BANCO nao tem valor padrao aqui de proposito:
## sem elas, a aplicacao falha ao iniciar (fail-fast), em vez de subir
## com uma senha padrao fraca em producao.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

## A API so pode ser chamada pelo frontend publicado no dominio real.
app.cors.origins=${CORS_ORIGINS}

## Credenciais do acesso administrativo a API.
app.security.username=${SECURITY_USERNAME}
app.security.password=${SECURITY_PASSWORD}

## Em producao, o trafego tem de ser HTTPS. O proxy (Nginx, Apache,
## balanceador) deve terminar o TLS e repassar o trafego; o Spring
## tambem pode forcar HTTPS direto.
server.forward-headers-strategy=framework
server.ssl.redirect=false

## Nao expoe detalhe do health check (podem vazar nomes de servicos).
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

## Log em arquivo, com rotacao (padrao do Spring Boot: 10 MB, 7 arquivos).
logging.file.name=${LOG_FILE:logs/leilao-api.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
