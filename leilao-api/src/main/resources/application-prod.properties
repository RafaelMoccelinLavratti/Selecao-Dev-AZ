## Perfil de producao.
##
##   mvn spring-boot:run -Dspring-boot.run.profiles=prod
##   java -jar target/leilao-api-1.0.0-SNAPSHOT.jar --spring.profiles.active=prod
##
## Com este perfil ativo, toda rota da API exige autenticacao e as
## credenciais do banco e da API vem obrigatoriamente de variaveis de
## ambiente: se alguma faltar, a aplicacao nao sobe (falha na hora de
## iniciar, e nao no meio do expediente com a API no ar e sem credencial).
##
##   $env:DATABASE_URL="jdbc:postgresql://localhost:5432/az"
##   $env:DATABASE_USER="leilao_app"
##   $env:DATABASE_PASSWORD="uma-senha-forte-aqui"
##   $env:SECURITY_ENABLED="true"
##   $env:SECURITY_USERNAME="admin"
##   $env:SECURITY_PASSWORD="outra-senha-forte-aqui"
##   $env:JWT_KEYS_DIR="/var/lib/leilao/chaves"
##   $env:AUDIT_HMAC_KEY="uma-chave-com-pelo-menos-32-bytes"
##   $env:CORS_ORIGINS="https://leilao.minhaempresa.com.br"

## Ativa a exigencia de autenticacao.
app.security.enabled=true

## Modo de autenticacao. Aqui o padrao e "jwt" (e nao "basic" como no
## perfil de desenvolvimento), porque o fluxo de token e o que emite a
## sessao do usuario e o que a API consome em producao.
##
## No modo "basic" o POST /auth/login emite um par de tokens que nao
## autentica nada: o filtro de JWT nao entra na cadeia de seguranca, e
## o token e recusado antes de chegar no controller. Deixar o padrao em
## "basic" significaria ter o fluxo de JWT desligado sem ninguem
## perceber.
app.security.mode=${SECURITY_MODE:jwt}

## As credenciais do banco nao tem valor padrao aqui de proposito:
## sem elas, a aplicacao falha ao iniciar (fail-fast), em vez de subir
## com uma senha padrao fraca em producao.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

## A pasta com as chaves RSA de assinatura do JWT nao tem valor padrao
## aqui de proposito.
##
## Sem essa pasta, o ChaveJwtProvider gera um par de chaves efemero, na
## memoria, a cada boot. Isso funciona numa instancia so, mas quebra em
## duas: cada replica assina com uma chave diferente, e o token emitido
## pela replica A e desconhecido na replica B. O resultado e 401
## aleatorio - "chave de assinatura desconhecida" - sem que nada tenha
## expirado ou sido revogado. Por isso a variavel e obrigatoria: se
## faltar, a aplicacao falha ao iniciar.
app.security.jwt.keys-dir=${JWT_KEYS_DIR}

## A chave do HMAC que fecha a trilha de auditoria tambem e obrigatoria.
##
## Sem ela, a cadeia de hashes e montada com uma chave efemera, gerada
## na subida. A trilha continua funcionando, mas "verificar" sempre
## responde que a integridade nao pode ser confirmada, e cada replica
## mantem uma cadeia diferente - o que nao serve para provar nada.
##
## A chave e usada como bytes crus (UTF-8), e precisa ter pelo menos 32
## bytes. Nao e hexadecimal: um valor de 32 caracteres e 32 bytes.
app.security.audit.hmac-key=${AUDIT_HMAC_KEY}

## A API so pode ser chamada pelo frontend publicado no dominio real.
app.cors.origins=${CORS_ORIGINS}

## Credenciais do acesso administrativo a API.
app.security.username=${SECURITY_USERNAME}
app.security.password=${SECURITY_PASSWORD}


## Controle anti-forca-bruta (obrigatorio em producao)
## Nao ha valores padrao aqui de proposito: se o limite nao for definido,
## a aplicacao sobe com o padrao do application.properties (5 tentativas
## por usuario / 20 por IP / janela de 15 minutos). Defina explicitamente
## pra deixar a intencao clara e auditavel.
app.security.rate-limit.enabled=true
app.security.rate-limit.max-attempts=${RATE_LIMIT_MAX_ATTEMPTS:5}
app.security.rate-limit.max-attempts-per-ip=${RATE_LIMIT_MAX_ATTEMPTS_PER_IP:20}
app.security.rate-limit.window-minutes=${RATE_LIMIT_WINDOW_MINUTES:15}

## Onde os contadores ficam guardados.
##
## Aqui e' "banco", e nao "memoria" como no perfil de desenvolvimento.
## A producao roda atras de um balanceador, com mais de uma replica: com
## o contador na memoria de cada processo, o limite por IP valeria so
## para a replica que o atacante acertou - e o limite por usuario
## (que depende do IP) sumiria de vez.
##
## Com o contador no banco, o limite vale para a API inteira. O preco e'
## uma ida ao banco a cada requisicao.
app.security.rate-limit.store=${RATE_LIMIT_STORE:banco}


## Confianca no X-Forwarded-For
## Em producao a aplicacao fica atras de um proxy reverso (Nginx ou o
## balanceador da nuvem), que e quem coloca o IP real do usuario no
## cabecalho X-Forwarded-For. Aqui confiamos nele.
##
## Uma condicao de seguranca: isso so e seguro se a aplicacao estiver
## acessivel apenas pelo proxy. Se alguem conseguir alcancar a porta da
## aplicacao direto, poderia forjar o cabecalho e burlar o bloqueio.
## Por isso, em producao, a porta da aplicacao nao deve estar exposta
## publicamente - apenas o proxy deve alcanca-la.
app.security.trust-proxy=${TRUST_PROXY:true}

## Em producao, o trafego tem de ser HTTPS. O proxy (Nginx, Apache,
## balanceador) deve terminar o TLS e repassar o trafego; o Spring
## tambem pode forcar HTTPS direto.
server.forward-headers-strategy=framework
server.ssl.redirect=false

## Nao expoe detalhe do health check (podem vazar nomes de servicos).
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

## Log em arquivo, com rotacao (padrao do Spring Boot: 10 MB, 7 arquivos).
logging.file.name=${LOG_FILE:logs/leilao-api.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
