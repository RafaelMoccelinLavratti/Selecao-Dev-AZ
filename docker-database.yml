---
  # Docker Compose - banco de dados PostgreSQL.
  #
  # Sobe o PostgreSQL com a estrutura e a massa de dados ja prontas, sem
  # precisar instalar o Postgres na maquina.
  #
  # Como usar:
  #     docker compose -f docker-database.yml up -d     (sobe o banco)
  #     docker compose -f docker-database.yml down      (derruba o banco)
  #     docker compose -f docker-database.yml logs -f   (ve o log)
  #
  # Na primeira subida, o container oficial do Postgres executa TODOS os
  # arquivos .sql da pasta /docker-entrypoint-initdb.d, em ordem alfabetica.
  # Como os nossos comecam com 01_ e 02_, a ordem e garantida:
  #     01_ddl.sql  -> cria as tabelas
  #     02_dml.sql  -> insere a massa de dados
  # O volume "postgresqldata" garante que isso so acontece na primeira vez:
  # se o volume ja existe, o Postgres nao reexecuta os scripts.
  version: "3"

  services:
    postgresql:
      # Versao 16 (LTS). O enunciado nao fixa versao; 16 e uma escolha
      # estavel e com suporte longo.
      image: "postgres:16-alpine"

      container_name: "leilao-postgres"

      ports:
        # "127.0.0.1:5432:5432" = porta 5432 do container liberada na
        # porta 5432 da maquina, MAS SO NO LOOPBACK.
        #
        # Por que o "127.0.0.1" na frente:
        #
        # Um "5432:5432" sem endereco faz o Docker publicar a porta em
        # TODAS as interfaces de rede da maquina - o 0.0.0.0. Num
        # notebook ligado na rede do escritorio, o Postgres fica
        # acessivel para qualquer pessoa da mesma rede, com a senha do
        # arquivo ".env" (que, em desenvolvimento, e publica).
        #
        # Com o "127.0.0.1" antes dos dois pontos, a porta so escuta na
        # propria maquina. A API roda na maquina (via "mvn
        # spring-boot:run"), entao continua conectando em
        # "localhost:5432" sem nenhuma mudanca - e o banco deixa de
        # estar exposto na rede.
        #
        # Quem precisar acessar de outra maquina da rede - o caso de
        # outro.container, por exemplo - troque por "5432:5432" de
        # proposito, sabendo o que esta abrindo.
        - "127.0.0.1:5432:5432"

      volumes:
        # 1) Volume nomeado: guarda os dados do banco mesmo que o container
        #    seja destruido e recriado.
        - "postgresqldata:/var/lib/postgresql/data"

        # 2) Os scripts de criacao do banco, montados na pasta que o
        #    container do Postgres executa na primeira subida.
        - "./leilao-api/src/main/resources/sql:/docker-entrypoint-initdb.d:ro"

      env_file:
        - ".env"

      # Fica aguardando: o container so considera "pronto" quando o
      # PostgreSQL aceitar conexoes de verdade.
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d az"]
        interval: 10s
        timeout: 5s
        retries: 5

      restart: unless-stopped

  volumes:
    postgresqldata:
      driver: local
