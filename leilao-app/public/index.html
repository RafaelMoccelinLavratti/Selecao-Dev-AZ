<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">

    <!--
      ==========================================================================
       IDENTIDADE DA MARCA
       ==========================================================================
       - A fonte Poppins e a tipografia oficial da AZ Tecnologia em Gestao.
         Carregada do Google Fonts (a mesma familia usada no site
         institucional, efcaz.com.br). O "display=swap" garante que a tela
         apareca com a fonte de reserva antes da Poppins baixar - a
         aplicacao nunca fica em branco esperando a fonte.
      - A cor "theme-color" e a cor de marca (#14b3cc), a mesma do logo.
         E ela que tinge a barra de endereco do navegador no celular,
         fazendo o sistema parecer com um aplicativo nativo.
      ==========================================================================
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#14b3cc">

    <meta name="description" content="Sistema de gestao de leiloes - avaliacao tecnica AZ Tecnologia em Gestao">
    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
