<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">

    <!--
      Identidade da marca.

      Duas fontes: Barlow no corpo do texto, Tomorrow nos titulos. As duas
      vem do Google Fonts, com os mesmos pesos do site institucional.
      O display=swap evita a tela ficar branca enquanto a Barlow nao baixa.

      A theme-color (#002436) e a cor de estrutura da marca. Ela tinge a
      barra de endereco no celular, o que faz o sistema parecer um app
      nativo.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Tomorrow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#002436">

    <meta name="description" content="Sistema de gestao de leiloes - avaliacao tecnica AZ Tecnologia em Gestao">
    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <noscript>
      <strong>Este sistema precisa de JavaScript. Ative o JavaScript no navegador e recarregue a pagina.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
