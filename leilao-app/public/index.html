<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">

    <!--
      ==========================================================================
       IDENTIDADE DA MARCA
       ==========================================================================
       - A instituicao usa DUAS fontes: **Barlow** no corpo do texto e
         **Tomorrow** nos titulos. As duas entram pelo Google Fonts, com os
         mesmos pesos que o site institucional carrega. O "display=swap"
         garante que a tela apareca com a fonte de reserva antes de a
         Barlow baixar - a aplicacao nunca fica em branco esperando a
         fonte.
       - A cor "theme-color" e a cor de estrutura da marca (#002436), a
         mesma da barra do site institucional. E ela que tinge a barra de
         endereco do navegador no celular, fazendo o sistema parecer com
         um aplicativo nativo.
       ==========================================================================
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Tomorrow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#002436">

    <meta name="description" content="Sistema de gestao de leiloes - avaliacao tecnica AZ Tecnologia em Gestao">
    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
