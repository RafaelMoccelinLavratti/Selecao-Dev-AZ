name: Build e Testes

on:
  push:
    branches: [master, main, "feature/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  api:
    name: API - build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Clona o repositorio
        uses: actions/checkout@v4

      # A versao do Java esta fixada de proposito: se o CI usasse
      # "latest", uma mudanca no JDK poderia quebrar o build sem
      # ninguem ter mexido no codigo.
      - name: Instala o Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Compila e roda os testes
        working-directory: leilao-api
        run: mvn -B -DskipTests=false test

      # O SBOM e o inventario das dependencias do artefato. Com ele da
      # para responder em segundos "usamos essa versao?" quando uma
      # vulnerabilidade aparece em uma biblioteca.
      - name: Gera o SBOM (Ciclo de Vida das Dependencias)
        working-directory: leilao-api
        run: mvn -B package -DskipTests
        env:
          CYCLONEDX: 'true'

      - name: Guarda o SBOM como artefato
        uses: actions/upload-artifact@v4
        with:
          name: sbom-leilao-api
          path: leilao-api/target/bom.json
          if-no-files-found: error

  frontend:
    name: Frontend - lint e build
    runs-on: ubuntu-latest

    steps:
      - name: Clona o repositorio
        uses: actions/checkout@v4

      - name: Instala o Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: leilao-app/package-lock.json

      # "npm ci" instala exatamente o que esta no package-lock.json e
      # falha se o lock estiver fora de sincronia com o package.json -
      # ao contrario do "npm install", que pode resolver versoes
      # diferentes em maquinas diferentes.
      - name: Instala as dependencias
        working-directory: leilao-app
        run: npm ci

      - name: Roda o linter
        working-directory: leilao-app
        run: npm run lint

      - name: Gera o build de producao
        working-directory: leilao-app
        run: npm run build
