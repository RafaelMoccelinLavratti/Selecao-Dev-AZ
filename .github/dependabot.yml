version: 2

updates:
  #  Dependencias da API (Maven)
  - package-ecosystem: "maven"
    directory: "/leilao-api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencia"
      - "backend"
    commit-message:
      prefix: "chore(api)"
      prefix-development: "chore(api)"
      include: "scope"
    # Mudancas de versao maior podem trazer quebra de API: ficam de fora
    # da atualizacao automatica e sao feitas a mao.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  #  Dependencias do frontend (npm)
  - package-ecosystem: "npm"
    directory: "/leilao-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencia"
      - "frontend"
    commit-message:
      prefix: "chore(app)"
      prefix-development: "chore(app)"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  #  Acoes do GitHub
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    labels:
      - "dependencia"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
